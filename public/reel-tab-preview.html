<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>换片键预览 / Reel Tab Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/public/style.css">
  <style>
    .pv-note {
      margin: 0 0 24px;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--handle);
      border-radius: var(--radius-sm);
    }
    .pv-actions { display: flex; gap: var(--s-3); margin-top: var(--s-5); flex-wrap: wrap; }
    .pv-fake {
      height: 220px;
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      color: var(--text-3);
      background: #000;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="film-rail" aria-hidden="true"></div>

    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">✂️</span>
        <span class="logo-text">Video Scissors</span>
      </div>
      <span class="tagline">可视化视频裁剪 · 全程本地处理</span>
    </header>

    <main class="app-main">
      <p class="pv-note">
        换片键预览页（临时文件，确认后可删）。<br>
        右上角那块就是新的固定定位换片键 —— 悬停试试，拍板会"啪"地合一下。
        注意 header 右侧的 tagline 会在它出现时淡出，由它接管那个位置。
      </p>
      <div class="pv-fake">（这里本来是视频监视窗）</div>
      <div class="pv-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('newVideoBar').classList.toggle('hidden')">显示 / 隐藏</button>
        <button class="btn btn-ghost" onclick="document.getElementById('newVideoBtn').disabled = !document.getElementById('newVideoBtn').disabled">切换 disabled</button>
        <button class="btn btn-ghost" onclick="document.querySelector('.reel-bar').classList.add('hidden'); setTimeout(()=>document.querySelector('.reel-bar').classList.remove('hidden'), 60)">重播入场动效</button>
      </div>
    </main>
  </div>

  <div id="newVideoBar" class="reel-bar">
    <button id="newVideoBtn" class="reel-tab" type="button" title="换一个视频（会清空当前切片）">
      <span class="reel-clapper" aria-hidden="true"></span>
      <span class="reel-text">
        <span class="reel-kicker">换片 / New Reel</span>
        <span class="reel-label">选择新视频</span>
      </span>
    </button>
  </div>
</body>
</html>
